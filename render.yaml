# ============================================================================
# Blueprint Render (offre gratuite) pour Tango Wallet.
#
# Render ne propose pas de MySQL managé : l'application tourne donc sur
# PostgreSQL (offert gratuitement par Render). Le code PHP est resté écrit pour
# MySQL ; la couche wallet/db.php traduit les requêtes automatiquement, aucune
# modification du code n'est nécessaire.
#
# 1. Poussez ce dépôt sur GitHub.
# 2. Render -> New + -> Blueprint -> sélectionnez ce dépôt.
# 3. Renseignez les variables marquées "sync: false" (Google, Plisio, admin).
#
# Le schéma PostgreSQL est importé automatiquement au premier démarrage
# (schema_pg.sql) : aucune étape manuelle d'import de base.
# ============================================================================
databases:
  - name: tango-wallet-db
    databaseName: wallet
    user: wallet
    plan: free
    region: frankfurt

services:
  - type: web
    name: tango-wallet
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: APP_ENV
        value: production
      - key: DB_DRIVER
        value: pgsql
      # Connexion à la base PostgreSQL gérée par Render (interne, même région).
      - key: DB_URL
        fromDatabase:
          name: tango-wallet-db
          property: connectionString
      # --- Secrets applicatifs (a renseigner dans Render) ---
      - key: ADMIN_PASSWORD
        sync: false
      - key: CRYPTO_KEY
        generateValue: true
      - key: CALLBACK_BASE_URL
        sync: false
      # --- Google OAuth ---
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      # --- Plisio ---
      - key: PLISIO_SECRET_KEY
        sync: false
