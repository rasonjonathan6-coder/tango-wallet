plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tango.wallet'
    compileSdk 34

    defaultConfig {
        applicationId "com.tango.wallet"
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName "1.2"
    }

    signingConfigs {
        release {
            // Mots de passe fournis par l'environnement au moment du build
            // (jamais committes). Le keystore lui-meme est gitignore.
            storeFile file("${rootProject.projectDir}/keystore/wallet-release.jks")
            storePassword System.getenv('TANGO_KEYSTORE_PASSWORD')
            keyAlias 'wallet'
            keyPassword System.getenv('TANGO_KEY_PASSWORD')
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.core:core-splashscreen:1.0.1'
}

// appcompat 1.7 tire kotlin-stdlib 1.8.22 tandis qu'une dependance transitive
// apporte encore kotlin-stdlib-jdk7/jdk8 1.6.21 : depuis Kotlin 1.8 ces classes
// sont fusionnees dans kotlin-stdlib, d'ou des "Duplicate class". On force la
// version recente et on exclut les anciens artefacts jdk7/jdk8.
configurations.all {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
    }
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}
